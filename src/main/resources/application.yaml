spring:
  application:
    name: mimw

  datasource:
    # prompt=false  → prevents JT400 from opening a Swing GUI dialog on auth failure
    # naming=sql    → use SQL-style schema.table naming (vs AS400 system naming schema/table)
    # errors=full   → full error messages from AS400
    # keepAlive=true → keeps connection alive
    # loginTimeout=60 → timeout for initial connection (seconds)
    # Override the entire URL with env var SPRING_DATASOURCE_URL if needed
    url: ${SPRING_DATASOURCE_URL:jdbc:as400://212.91.124.230;prompt=false;naming=sql;errors=full;keepAlive=true;loginTimeout=60}
    username: ${SPRING_DATASOURCE_USERNAME:msecofr}
    # Password is computed dynamically as MMYY (e.g. March 2026 = "0326").
    # Override with env var SPRING_DATASOURCE_PASSWORD if needed.
    driver-class-name: com.ibm.as400.access.AS400JDBCDriver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 600000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      # Allow the app to start even if AS400 is unreachable at boot time
      # (e.g. Render deployment where AS400 is on a private network).
      # Connections will be established lazily on first request.
      initialization-fail-timeout: -1

server:
  port: ${PORT:8081}

