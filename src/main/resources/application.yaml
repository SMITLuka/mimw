spring:
  application:
    name: mimw

  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:changeme}

  datasource:
    # --- SQL Server (Pantheon) via Linked Server to AS400 ---
    # Set these env vars on Render:
    #   SPRING_DATASOURCE_URL      = jdbc:sqlserver://SQL_SERVER_IP:1433;databaseName=PANTHEON_DB;encrypt=true;trustServerCertificate=true
    #   SPRING_DATASOURCE_USERNAME = sql_server_username
    #   SPRING_DATASOURCE_PASSWORD = sql_server_password
    # Local dev: integratedSecurity=true uses your Windows session (same as Pantheon Client)
    # Render/prod: override SPRING_DATASOURCE_URL with a SQL login URL + set USERNAME/PASSWORD env vars
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://141.138.12.247:1666;databaseName=PPMVPROGRAM;encrypt=true;trustServerCertificate=true;integratedSecurity=true}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 600000
      initialization-fail-timeout: -1

  mail:
    host: ${MAIL_HOST:mail.smtp2go.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:adriavc1}
    password: ${MAIL_PASSWORD:a1234c}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# --- AS400 Linked Server config ---
# AS400_LINKED_SERVER: name of the linked server in SQL Server (from _cdp_param.aclinkserver)
#                      Leave blank to auto-read from _cdp_param table at startup.
# AS400_CATALOG:       AS400 database/catalog name (default: ADRIAVC1)
# AS400_DATA_GROUP:    AS400 data group prefix (e.g. KB0). Combined with AS400_BRANCH to compute
#                      the HF library: (dataGroup + "D" + branch).substring(0,4) + "1K"
# AS400_BRANCH:        AS400 branch number (e.g. 1). Used together with AS400_DATA_GROUP.
as400:
  linked-server: ${AS400_LINKED_SERVER:}
  catalog: ${AS400_CATALOG:ADRIAVC1}
  data-group: ${AS400_DATA_GROUP:}
  branch: ${AS400_BRANCH:1}

# --- Integration Hub ---
# When INTEGRATION_HUB_URL is set, each company's SQL Server connection and AS400 settings are read from
# Integration Hub (GET /service/configuration) using the mandatorId/companyId headers Ares sends.
# The keys in Hub's "MIMW integration" configuration have the same names as the env variables above
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, AS400_DATA_GROUP, AS400_BRANCH, ...).
# When it is empty, MIMW serves one company with the env variables above (previous behaviour).
integration-hub:
  url: ${INTEGRATION_HUB_URL:}
  api-key: ${INTEGRATION_HUB_API_KEY:}
  interface-name: ${INTEGRATION_HUB_INTERFACE:MIMW integration}
  cache-seconds: ${INTEGRATION_HUB_CACHE_SECONDS:300}

# The datasource depends on the company of the request, so there is no single database to health-check.
management:
  health:
    db:
      enabled: false

server:
  port: ${PORT:8081}

mimw:
  mail:
    from: ${MAIL_FROM:mi-mv@sm-it.hr}
